apiVersion: v1
kind: Secret
metadata:
    name: jenkins-secrets-map
    namespace: jenkins-dev
data:
    github-token: U2VjcmV0IHZhbHVl
    github-username: U2VjcmV0IHZhbHVl
    # Agent secret of the node, shown by the controller when the node is
