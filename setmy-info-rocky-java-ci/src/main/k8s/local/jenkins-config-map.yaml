apiVersion: v1
kind: ConfigMap
metadata:
    name: jenkins-config-map
    namespace: jenkins-local
data:
    jenkins-url: "http://192.168.0.10:7070"
    # Address of the controller as seen by the agent nodes inside the cluster.
    #controller-host: "jenkins-service.jenkins-local.svc.cluster.local"
    controller-host: "192.168.0.10"
    controller-port: "7070"
    # Name of the node as created on the controller. The agent secret in
    # jenkins-secrets-map belongs to exactly this node.
    node-name: "kubernetes-node-1"
immutable: true
